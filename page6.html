<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Gallery</title>

<style>
    body {
        margin: 0;
        background: #ffb6d9; 
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        color: white;
        overflow: hidden;
    }

    h1 { margin-top: 20px; font-size: 24px; }

    .gallery-box {
        width: 90%;
        height: 430px;
        background: white;
        border-radius: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        margin-top: 20px;
        box-shadow: 0 0 20px rgba(0,0,0,0.2);
    }

    .gallery-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .btn-area {
        margin-top: 25px;
        display: flex;
        gap: 20px;
    }

    button {
        background: hotpink;
        color: white;
        padding: 15px 25px;
        border: none;
        border-radius: 30px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 0 10px rgba(0,0,0,0.3);
        transition: 0.2s;
    }

    button:active { transform: scale(0.9); }
</style>

</head>
<body>

<h1>💗 Your Birthday Edits 💗</h1>

<div class="gallery-box">
    <img id="editImage" src="edit1.png">
</div>

<div class="btn-area">
    <button onclick="prev()">⟵ Previous</button>
    <button onclick="next()">Next ⟶</button>
</div>

<script>
    let edits = ["edit1.png","edit2.png","edit3.png","edit4.png","edit5.png","edit6.png"];
    let i = 0;

    function next(){
        i = (i+1) % edits.length;
        document.getElementById("editImage").src = edits[i];
    }

    function prev(){
        i = (i-1+edits.length) % edits.length;
        document.getElementById("editImage").src = edits[i];
    }
</script>

</body>
</html>
