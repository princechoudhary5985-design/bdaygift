<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Edits Viewer</title>

<style>
    body{
        background:black;
        color:white;
        margin:0;
        display:flex;
        flex-direction:column;
        justify-content:center;
        align-items:center;
        height:100vh;
        font-family:Arial;
        overflow:hidden;
    }
    #viewer{
        width:80vw;
        height:70vh;
        background:#111;
        border:3px solid white;
        border-radius:10px;
        display:flex;
        align-items:center;
        justify-content:center;
        overflow:hidden;
    }
    #viewer video,#viewer img{
        width:100%;
        height:100%;
        object-fit:contain;
    }
    .controls{
        margin-top:20px;
        display:flex;
        gap:20px;
    }
    button{
        padding:10px 25px;
        font-size:18px;
        background:#ff87c5;
        color:black;
        border:none;
        border-radius:6px;
        cursor:pointer;
    }
    button:hover{
        background:#ffc7e9;
    }
</style>
</head>

<body>

<div id="viewer">

    <!-- 🔥 EDITS HERE (you may add/remove) -->
    
    <video class="edit" src="diyaya.mp4" controls autoplay></video>
    <video class="edit" src="edit2.mp4" controls style="display:none"></video>
    <img   class="edit" src="edit3.png" style="display:none">
    <video class="edit" src="edit4.mp4" controls style="display:none"></video>
    <img   class="edit" src="edit5.png" style="display:none">
    <video class="edit" src="edit6.mp4" controls style="display:none"></video>

</div>

<div class="controls">
    <button onclick="prev()">⬅ Prev</button>
    <button onclick="next()">Next ➡</button>
</div>

<script>
let edits = document.querySelectorAll(".edit");
let current = 0;

function showEdit(i){
    edits.forEach((e,j)=>e.style.display = j===i ? "block" : "none");
}

function next(){
    if(current < edits.length-1){
        current++;
        showEdit(current);
    }
}
function prev(){
    if(current > 0){
        current--;
        showEdit(current);
    }
}

showEdit(0);
</script>

</body>
</html>
