<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Page 6</title>
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: 'Arial', sans-serif;
    background: #ffe0f0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  /* SCROLLABLE CONTAINER */
  .scroll-container {
    width: 80vw;
    height: 80vh;
    overflow-y: auto;
    padding: 20px;
    background: rgba(255, 255, 255, 0.95);
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    line-height: 1.6;
    font-size: 18px;
    color: #333;
  }

  /* BACK BUTTON */
  #back-btn {
    position: fixed;
    top: 20px;
    left: 20px;
    padding: 10px 20px;
    border-radius: 8px;
    border: none;
    background: #ff99cc;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 5px 10px rgba(0,0,0,0.3);
    z-index: 1000;
  }

</style>
</head>
<body>

<button id="back-btn">Back</button>

<div class="scroll-container">
  <p>
     
  </p>
</div>

<script>
  const backBtn = document.getElementById('back-btn');
  backBtn.addEventListener('click', () => {
    window.history.back(); // goes back to previous page
  });
</script>

</body>
</html>
