<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Floating Memories</title>

<style>
/* ————— BACKGROUND ————— */
body{
    margin:0;
    padding:0;
    overflow:hidden;
    background:url('hellokittybg.png') center/cover no-repeat fixed;
    animation:bgPulse 10s infinite alternate ease-in-out;
}

/* dreamy background breathing animation */
@keyframes bgPulse{
    0%{filter:brightness(100%) saturate(100%);}
    100%{filter:brightness(115%) saturate(130%);}
}

/* ————— FLOATING IMAGE STYLE ————— */
.float{
    position:absolute;
    border-radius:18px;
    filter:drop-shadow(0 0 20px rgba(255,130,170,0.8));
    opacity:0;
    animation:
        fadeIn 2.5s forwards,
        floatY 12s infinite ease-in-out alternate,
        floatX 18s infinite linear,
        subtleSpin 14s infinite ease-in-out alternate;
    transition:transform .5s;
}

/* hover — little glowing bloom */
.float:hover{
    transform:scale(1.12) rotate(2deg);
    filter:drop-shadow(0 0 35px rgba(255,90,150,1));
}

/* SIZES */
.big{ width:290px; animation-duration:20s; }
.small{ width:170px; animation-duration:14s; }

/* Animations */
@keyframes fadeIn{
    0%{opacity:0; transform:scale(.8);}
    100%{opacity:1; transform:scale(1);}
}
@keyframes floatY{
    0%{transform:translateY(-20px);}
    100%{transform:translateY(35px);}
}
@keyframes floatX{
    0%{left:-15%;}
    100%{left:115%;}
}
@keyframes subtleSpin{
    0%{transform:rotate(-3deg);}
    100%{transform:rotate(3deg);}
}

/* ————— NEXT BUTTON ————— */
.nextBtn{
    position:fixed;
    bottom:30px;
    right:35px;
    padding:14px 32px;
    background:#ff72b2;
    color:white;
    border:none;
    font-size:1.35rem;
    font-weight:bold;
    border-radius:32px;
    letter-spacing:1px;
    cursor:pointer;
    box-shadow:0 0 25px rgba(255,105,180,.7);
    transition:.4s;
}
.nextBtn:hover{
    transform:scale(1.15) translateY(-3px);
    background:#ff539b;
}
</style>
</head>
<body>

<!-- ——— BIG (3) ——— -->
<img src="big1.png" class="float big" style="top:12%; animation-delay:0s;">
<img src="big2.png" class="float big" style="top:48%; animation-delay:1.5s;">
<img src="big3.png" class="float big" style="top:78%; animation-delay:3s;">

<!-- ——— SMALL (3) ——— -->
<img src="small1.png" class="float small" style="top:28%; animation-delay:.8s;">
<img src="small2.png" class="float small" style="top:58%; animation-delay:2.4s;">
<img src="small3.png" class="float small" style="top:85%; animation-delay:4s;">

<button class="nextBtn" onclick="location.href='page6.html'">Next ➜</button>

</body>
</html>
