<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Page 5</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(to bottom, #ffecd2, #fcb69f);
      overflow: hidden;
      font-family: 'Arial', sans-serif;
    }

    /* Music controls */
    #music {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 1000;
    }

    /* Rolling cassette/CD container */
    .cassette-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 250px;
      height: 250px;
      animation: spin 5s linear infinite;
    }

    @keyframes spin {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .cassette {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: url('https://i.postimg.cc/L4C6gTtF/cd.png') no-repeat center/cover;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    /* Photos */
    .photo {
      position: absolute;
      border-radius: 15px;
      object-fit: cover;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      transition: transform 0.5s;
    }

    .photo:hover {
      transform: scale(1.2) rotate(10deg);
      z-index: 999;
    }

    /* Big photos */
    .big {
      width: 150px;
      height: 150px;
    }

    /* Small photos */
    .small {
      width: 100px;
      height: 100px;
    }

  </style>
</head>
<body>

  <!-- Music -->
  <audio id="music" controls autoplay loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <!-- Cassette/CD -->
  <div class="cassette-container">
    <div class="cassette"></div>
  </div>

  <!-- Photos -->
  <img src="big1.png" class="photo big">
  <img src="big2.png" class="photo big">
  <img src="big3.png" class="photo big">
  <img src="small1.png" class="photo small">
  <img src="small2.png" class="photo small">
  <img src="small3.png" class="photo small">

  <script>
    // Randomize photo positions
    const photos = document.querySelectorAll('.photo');

    function randomizePhotos() {
      const width = window.innerWidth;
      const height = window.innerHeight;

      photos.forEach(photo => {
        const photoWidth = photo.offsetWidth;
        const photoHeight = photo.offsetHeight;
        const x = Math.random() * (width - photoWidth);
        const y = Math.random() * (height - photoHeight);
        photo.style.left = x + 'px';
        photo.style.top = y + 'px';
      });
    }

    window.addEventListener('resize', randomizePhotos);
    randomizePhotos();
  </script>
</body>
</html>
