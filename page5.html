<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Page 5</title>
<style>
  body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    font-family: 'Arial', sans-serif;
  }

  /* MUSIC CONTROLS */
  #music {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 1000;
    border-radius: 10px;
    box-shadow: 0 5px 10px rgba(0,0,0,0.3);
  }

  /* BACKGROUND KITTY IMAGE */
  #bg-img {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -1;
  }

  /* CASSETTE / VINYL IMAGE (bottom center, no movement) */
  #cassette-container {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    height: 200px;
    z-index: 500;
  }

  #cassette {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    animation: spin 3s linear infinite;
    box-shadow: 0 15px 30px rgba(0,0,0,0.4), 0 0 40px rgba(255,182,193,0.6) inset;
    border: 5px solid #fff;
  }

  @keyframes spin {
    0% { transform: rotate(0deg);}
    100% { transform: rotate(360deg);}
  }

  /* PHOTOS */
  .photo {
    position: absolute;
    border-radius: 15px;
    object-fit: cover;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    transition: transform 0.5s, box-shadow 0.5s;
    cursor: pointer;
  }

  .photo:hover {
    transform: scale(1.3) rotate(10deg);
    box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    z-index: 999;
  }

  .big { width: 150px; height: 150px; }
  .small { width: 100px; height: 100px; }

  /* FULLSCREEN PHOTO VIEW */
  .fullscreen {
    position: fixed !important;
    top: 50% !important;
    left: 50% !important;
    width: 80vw !important;
    height: 80vh !important;
    transform: translate(-50%, -50%) !important;
    border-radius: 0 !important;
    z-index: 2000 !important;
    box-shadow: 0 0 50px rgba(0,0,0,0.8);
    transition: all 0.5s ease;
  }

  /* CONFETTI */
  .confetti {
    position: absolute;
    width: 10px;
    height: 10px;
    opacity: 0.7;
    border-radius: 50%;
    animation: fall 5s linear infinite;
  }

  @keyframes fall {
    0% { transform: translateY(-50px) rotate(0deg);}
    100% { transform: translateY(100vh) rotate(360deg);}
  }
</style>
</head>
<body>

<!-- BACKGROUND KITTY IMAGE -->
<img src="kittybg.jpg" id="bg-img" alt="Background Kitty">

<!-- MUSIC -->
<audio id="music" controls autoplay loop>
  <source src="songss.mp3" type="audio/mpeg">
  Your browser does not support the audio element.
</audio>

<!-- CASSETTE / VINYL IMAGE (bottom center) -->
<div id="cassette-container">
  <img src="song1cover.jpg" id="cassette" alt="Cassette Cover">
</div>

<!-- PHOTOS -->
<img src="big1.png" id="big1" class="photo big">
<img src="big2.png" id="big2" class="photo big">
<img src="big3.png" id="big3" class="photo big">
<img src="small1.png" id="small1" class="photo small">
<img src="small2.png" id="small2" class="photo small">
<img src="small3.png" id="small3" class="photo small">

<script>
  const photos = document.querySelectorAll('.photo');

  // RANDOMIZE PHOTO POSITIONS
  function randomizePhotos() {
    const width = window.innerWidth;
    const height = window.innerHeight;
    photos.forEach(photo => {
      const photoWidth = photo.offsetWidth;
      const photoHeight = photo.offsetHeight;
      const x = Math.random() * (width - photoWidth);
      const y = Math.random() * (height - photoHeight);
      photo.style.left = x + 'px';
      photo.style.top = y + 'px';
    });
  }
  window.addEventListener('resize', randomizePhotos);
  randomizePhotos();

  // ADD CONFETTI
  for(let i=0; i<30; i++){
    const confetti = document.createElement('div');
    confetti.classList.add('confetti');
    confetti.style.left = Math.random() * window.innerWidth + 'px';
    confetti.style.animationDuration = (2 + Math.random()*3) + 's';
    confetti.style.background = `hsl(${Math.random()*360}, 80%, 60%)`;
    document.body.appendChild(confetti);
  }

  // PHOTO CLICK TO FULLSCREEN
  photos.forEach(photo => {
    photo.addEventListener('click', () => {
      // Reset all photos
      photos.forEach(p => p.classList.remove('fullscreen'));

      // Make clicked photo fullscreen
      photo.classList.add('fullscreen');
    });
  });
</script>

</body>
</html>
