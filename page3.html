<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Catch the Cats — Page 3</title>
<style>
  :root{
    --bg1:#fff5f8;
    --accent:#ff5f8f;
    --accent-dark:#d33b60;
  }
  html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;}
  body{background:linear-gradient(180deg,var(--bg1),#ffeef6);display:flex;align-items:center;justify-content:center;overflow:hidden}

  /* game container */
  #game-wrap{position:relative;width:100%;max-width:1100px;height:85vh;background:transparent;border-radius:12px;overflow:hidden}
  #gameCanvas{display:block;width:100%;height:100%}

  /* HUD */
  #hud{position:absolute;left:18px;top:12px;color:var(--accent-dark);font-weight:700;font-size:18px;text-shadow:0 1px 0 #fff;z-index:20}
  #hud span{color:var(--accent)}
  #instr{position:absolute;right:18px;top:12px;color:#8b1d3a;font-size:14px;z-index:20}

  /* Pink basket with bow (pure CSS) */
  #basket{
    position:absolute;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    width:160px;
    height:86px;
    pointer-events:none; /* we handle input separately */
    z-index:30;
  }
  .basket-body{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    bottom:0;
    width:140px;
    height:54px;
    border-radius:22px 22px 12px 12px;
    background: linear-gradient(180deg,#ff80ac,#ff4f79);
    box-shadow:0 10px 24px rgba(0,0,0,0.18);
    display:flex;align-items:flex-end;justify-content:center;
  }
  .basket-inner{
    width:120px;height:30px;background:linear-gradient(180deg,#ffd6e6,#fff);border-radius:10px;margin-bottom:6px;
  }
  .basket-rim{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    bottom:46px;
    width:170px;height:18px;background:#fff4f8;border-radius:10px;box-shadow:0 6px 14px rgba(0,0,0,0.08);
  }
  /* Bow */
  .bow{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    bottom:86px;
    width:70px;height:40px;
    pointer-events:none;
  }
  .bow .left, .bow .right {
    position:absolute; top:8px;
    width:30px;height:30px;border-radius:50%;
    background:linear-gradient(180deg,#ffb6d1,#ff4f79); box-shadow:0 6px 14px rgba(0,0,0,0.12);
  }
  .bow .left{left:0; transform:rotate(-20deg);}
  .bow .right{right:0; transform:rotate(20deg);}
  .bow .knot{
    position:absolute; left:50%; transform:translateX(-50%); top:10px;
    width:18px;height:18px;border-radius:50%;background:#d33b60; box-shadow:0 4px 8px rgba(0,0,0,0.12);
  }

  /* message overlay */
  #caughtMsg{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:rgba(255,255,255,0.95);padding:18px 26px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.12);display:none;text-align:center;z-index:10001}
  #caughtMsg h2{margin:0 0 8px;color:var(--accent-dark)}
  #caughtMsg p{margin:0;color:#333}

  /* video overlay (fullscreen) */
  #video-overlay{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;z-index:100000}
  #video-overlay video{width:100%;height:100%;object-fit:cover}

  /* play-button if autoplay blocked */
  #videoPlayBtn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--accent);border:none;color:#fff;padding:14px 24px;border-radius:12px;font-size:18px;cursor:pointer;display:none;box-shadow:0 10px 30px rgba(0,0,0,0.3);z-index:100001}

  /* fallback next */
  #nextFallback{display:none;position:fixed;right:18px;bottom:18px;padding:12px 16px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-weight:700;z-index:100002;cursor:pointer}

  @media(max-width:600px){
    #basket{width:120px;height:66px}
    .basket-body{width:100px;height:48px}
  }
</style>
</head>
<body>

<div id="game-wrap">
  <canvas id="gameCanvas"></canvas>

  <div id="hud">Caught: <span id="count">0</span>/10</div>
  <div id="instr">Move: drag / touch / ← →</div>

  <div id="basket" aria-hidden="true">
    <div class="bow"><div class="left"></div><div class="right"></div><div class="knot"></div></div>
    <div class="basket-rim"></div>
    <div class="basket-body"><div class="basket-inner"></div></div>
  </div>

  <div id="caughtMsg"><h2>All cats caught! 🎉</h2><p>Your surprise is coming…</p></div>
</div>

<!-- video overlay -->
<div id="video-overlay">
  <video id="surpriseVideo" playsinline webkit-playsinline preload="auto" src="hervideoedit.mp4"></video>
  <button id="videoPlayBtn">Play Video</button>
</div>

<button id="nextFallback" onclick="location.href='page4.html'">Continue →</button>

<script>
/* ---------- Setup canvas and sizes ---------- */
const wrap = document.getElementById('game-wrap');
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: true });
const basketEl = document.getElementById('basket');
const countEl = document.getElementById('count');
const caughtMsg = document.getElementById('caughtMsg');
const overlay = document.getElementById('video-overlay');
const video = document.getElementById('surpriseVideo');
const videoPlayBtn = document.getElementById('videoPlayBtn');
const nextFallback = document.getElementById('nextFallback');

let W,H,scale;
function resize(){
  const rect = wrap.getBoundingClientRect();
  W = rect.width;
  H = rect.height;
  scale = window.devicePixelRatio || 1;
  canvas.width = Math.floor(W * scale);
  canvas.height = Math.floor(H * scale);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(scale,0,0,scale,0,0);
  basket.x = clamp(basket.x, 60, W-60);
  updateBasketDOM();
}
window.addEventListener('resize', resize);

/* ---------- Game state ---------- */
const cats = [];
let lastTime = performance.now();
let spawnTimer = 0;
const spawnInterval = 650; // ms
let caught = 0;
const TARGET = 10;
let gameOver = false;
function rand(min,max){ return Math.random()*(max-min)+min; }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

/* ---------- Basket state ---------- */
const basket = { x: 400, width: 140, height: 54 };

/* ---------- Input handling ---------- */
let dragging = false;
wrap.addEventListener('mousedown', (e)=>{ dragging=true; moveBasket(e); });
window.addEventListener('mouseup', ()=>dragging=false);
wrap.addEventListener('mousemove', (e)=>{ if(dragging) moveBasket(e); });

wrap.addEventListener('touchstart', (e)=>{ dragging=true; moveBasket(e.touches[0]); e.preventDefault(); }, {passive:false});
wrap.addEventListener('touchmove', (e)=>{ if(dragging) moveBasket(e.touches[0]); e.preventDefault(); }, {passive:false});
wrap.addEventListener('touchend', ()=>dragging=false);

window.addEventListener('keydown',(e)=>{
  if(e.key==='ArrowLeft'){ basket.x -= 40; }
  if(e.key==='ArrowRight'){ basket.x += 40; }
  basket.x = clamp(basket.x, 60, W-60);
  updateBasketDOM();
});

function moveBasket(e){
  const rect = wrap.getBoundingClientRect();
  const clientX = e.clientX != undefined ? e.clientX : (e.pageX || 0);
  const x = clientX - rect.left;
  basket.x = clamp(x, 60, W-60);
  updateBasketDOM();
}
function updateBasketDOM(){
  // center basket element at basket.x
  basketEl.style.left = (basket.x) + 'px';
}

/* ---------- Draw cat (emoji) ---------- */
function drawCat(x,y,size,alpha){
  ctx.save();
  ctx.globalAlpha = alpha;
  // use emoji as text (works on modern browsers)
  ctx.font = (size) + 'px serif';
  ctx.textAlign = 'center';
  ctx.fillText('🐱', x, y + size*0.25); // vertical offset to center emoji visually
  ctx.restore();
}

/* ---------- Game loop ---------- */
function createCat(){
  const size = Math.floor(rand(26,48));
  const x = rand(30, W-30);
  const y = -rand(20,140);
  const speed = rand(1.6,3.4);
  cats.push({ x,y,size,speed, caught:false, sway: rand(0,Math.PI*2) });
}

function intersects(cat){
  const bTop = H - 18 - basket.height; // approximate top of basket catch zone
  const bLeft = basket.x - basket.width/2;
  const bRight = basket.x + basket.width/2;
  return (cat.y + cat.size*0.6 >= bTop && cat.x > bLeft && cat.x < bRight);
}

function loop(now){
  const dt = now - lastTime;
  lastTime = now;
  spawnTimer += dt;

  if(spawnTimer > spawnInterval && !gameOver){
    spawnTimer = 0;
    createCat();
  }

  ctx.clearRect(0,0,W,H);
  // draw background soft bokeh (optional)
  // update and draw cats
  for(let i=cats.length-1;i>=0;i--){
    const c = cats[i];
    c.y += c.speed;
    c.sway += 0.02;
    c.x += Math.sin(c.sway)*0.6;

    // draw shadow
    ctx.beginPath();
    ctx.ellipse(c.x+6, c.y + c.size*0.7, c.size*0.6, c.size*0.25, 0, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(0,0,0,0.06)';
    ctx.fill();

    drawCat(c.x, c.y, c.size, 1);

    if(c.y > H + 80){
      cats.splice(i,1);
      playMiss(); // play miss sound when a cat falls
      continue;
    }

    if(!c.caught && intersects(c)){
      c.caught = true;
      cats.splice(i,1);
      caught++;
      countEl.textContent = caught;
      playNya(); // catch sound
      flash();
      if(caught >= TARGET) onWin();
    }
  }

  requestAnimationFrame(loop);
}

/* ---------- Visual feedback ---------- */
function flash(){
  wrap.style.boxShadow = '0 0 40px rgba(255,80,140,0.2)';
  setTimeout(()=>wrap.style.boxShadow='none',160);
}

/* ---------- Win sequence: show message then play video ---------- */
function onWin(){
  gameOver = true;
  caughtMsg.style.display = 'block';
  playWinTone();
  setTimeout(()=> {
    caughtMsg.style.display = 'none';
    playFullScreenVideo();
  }, 900);
}

/* ---------- Fullscreen video handling ---------- */
function playFullScreenVideo(){
  overlay.style.display = 'flex';
  video.currentTime = 0;
  const p = video.play();
  if(p && typeof p.then === 'function'){
    p.then(()=> {
      // playing
      videoPlayBtn.style.display = 'none';
    }).catch(err=>{
      // autoplay blocked: show large play button for user to tap
      videoPlayBtn.style.display = 'block';
      videoPlayBtn.onclick = function(e){
        e.stopPropagation();
        video.play().then(()=> {
          videoPlayBtn.style.display = 'none';
        }).catch(()=>{});
      };
      nextFallback.style.display = 'block';
    });
  } else {
    // older browsers: rely on user tapping overlay
    videoPlayBtn.style.display = 'block';
    nextFallback.style.display = 'block';
  }

  video.onended = function(){
    overlay.style.display = 'none';
    window.location.href = 'page4.html';
  };

  // allow tap overlay to skip if user wants
  overlay.onclick = function(){
    if(!video.paused){
      // pause and go next
      video.pause();
      window.location.href = 'page4.html';
    }
  };
}

/* ---------- Audio (WebAudio synth for "nya" and effects) ---------- */
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function ensureAudio(){
  if(!audioCtx) audioCtx = new AudioCtx();
}

function playNya(){
  ensureAudio();
  const t = audioCtx.currentTime;
  // simple "nya" style: short frequency glide with bandpass
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 1200;
  filter.Q.value = 6;

  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(700, t);
  osc.frequency.exponentialRampToValueAtTime(1100, t + 0.09);

  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(0.12, t + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);

  osc.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(t);
  osc.stop(t + 0.45);
}

function playMiss(){
  ensureAudio();
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'triangle';
  o.frequency.setValueAtTime(150, t);
  g.gain.setValueAtTime(0.12, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + 0.25);
}

function playWinTone(){
  ensureAudio();
  const t = audioCtx.currentTime;
  const freqs = [880, 1320, 1760];
  freqs.forEach((f,i)=>{
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(f, t + i*0.08);
    g.gain.setValueAtTime(0.12, t + i*0.08);
    g.gain.exponentialRampToValueAtTime(0.001, t + i*0.08 + 0.32);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t + i*0.08); o.stop(t + i*0.08 + 0.4);
  });
}

/* ---------- Init ---------- */
function init(){
  resize();
  basket.x = W/2;
  updateBasketDOM();
  // pre-fill a few cats
  for(let i=0;i<6;i++) createCat();
  requestAnimationFrame(loop);
}
init();

/* ensure resize on first paint */
setTimeout(resize,100);

/* expose audio start for mobile gesture: start audio on first tap */
document.addEventListener('click', function oneTimeStart(){
  ensureAudio();
  document.removeEventListener('click', oneTimeStart);
});

/* Optional: load video metadata to reduce delay */
video.load();

</script>
</body>
</html>
