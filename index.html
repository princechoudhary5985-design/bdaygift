<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Happy Birthday</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom right, #ffdde1, #fbb1bd);
            font-family: "Poppins", sans-serif;
            text-align: center;
            overflow: hidden;
        }

        #helloKitty {
            width: 250px;
            cursor: pointer;
            margin-top: 60px;
            transition: transform 0.3s ease;
        }

        #helloKitty:hover {
            transform: scale(1.1);
        }

        #message {
            margin-top: 30px;
            font-size: 32px;
            font-weight: 800;
            color: #ff2d74;
            display: none;
            animation: pop 1s ease forwards;
        }

        @keyframes pop {
            0% { opacity: 0; transform: scale(0.3); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Floating balloons */
        .balloon {
            position: absolute;
            width: 55px;
            animation: floatUp 6s linear infinite;
        }

        @keyframes floatUp {
            0%   { transform: translateY(100vh); }
            100% { transform: translateY(-200px); }
        }

        /* Next Button */
        #nextBtn {
            display: none;
            margin-top: 40px;
        }

        .nextButton {
            padding: 15px 35px;
            background: #ff2d74;
            color: white;
            border: none;
            border-radius: 40px;
            font-size: 20px;
            cursor: pointer;
            animation: fadeIn 2s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
    </style>
</head>

<body>

    <h1 style="margin-top: 20px; color:#d6336c;">Tap Hello Kitty 🎀</h1>

    <!-- Replace helloKitty.png with your real image -->
    <img id="helloKitty" src="https://media.tenor.com/Y0D4Zb_hED0AAAAC/hello-kitty-dancing.gif" alt="Hello Kitty">

    <div id="message">🎉 Happy Birthday Darling! 🎉</div>

    <div id="nextBtn">
        <button class="nextButton" onclick="goNext()">Next Page →</button>
    </div>

    <script>
        let clicked = false;

        function createBalloon() {
            const balloon = document.createElement("img");
            balloon.src = "balloon.png";  // <-- your balloon image
            balloon.classList.add("balloon");

            balloon.style.left = Math.random() * 90 + "%";
            balloon.style.animationDuration = (Math.random() * 3 + 4) + "s";

            document.body.appendChild(balloon);

            setTimeout(() => balloon.remove(), 6000);
        }

        document.getElementById("helloKitty").addEventListener("click", () => {
            if (clicked) return;
            clicked = true;

            document.getElementById("message").style.display = "block";

            setInterval(createBalloon, 500);

            setTimeout(() => {
                document.getElementById("nextBtn").style.display = "block";
            }, 10000);
        });

        function goNext() {
            window.location.href = "page2.html";
        }
    </script>

</body>
</html>
