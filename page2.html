<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mini Balloon Game</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(to bottom right, #ffdde1, #ee9ca7);
            font-family: "Poppins", sans-serif;
        }

        /* Title */
        .title {
            text-align: center;
            color: #fff;
            font-size: 30px;
            margin-top: 20px;
            animation: fadeIn 2s ease;
        }

        .count {
            text-align: center;
            color: white;
            font-size: 20px;
        }

        /* Balloons */
        #balloon-container {
            position: relative;
            width: 100%;
            height: 100vh;
        }

        .balloon {
            position: absolute;
            width: 60px;
            cursor: pointer;
            animation: floatUp 5s linear infinite;
        }

        /* Balloon floating animation */
        @keyframes floatUp {
            from { transform: translateY(100vh); }
            to { transform: translateY(-200px); }
        }

        /* Fade in */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Video overlay */
        #video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            background: black;
        }

        #surpriseVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>

<body>

<div id="game-area">
    <h2 class="title">Pop 10 Balloons 🎈</h2>
    <p class="count">Popped: <span id="popped">0</span>/10</p>

    <div id="balloon-container"></div>
</div>

<!-- Video overlay -->
<div id="video-overlay">
    <video id="surpriseVideo" src="video.mp4"></video>
</div>

<script>
let popped = 0;

// Create 10 balloons
function createBalloons() {
    const container = document.getElementById("balloon-container");

    for (let i = 0; i < 10; i++) {
        let balloon = document.createElement("img");
        balloon.src = "balloon.png"; // your balloon image
        balloon.classList.add("balloon");

        // Random horizontal position
        balloon.style.left = Math.random() * 90 + "%";

        // Pop Action
        balloon.addEventListener("click", () => {
            balloon.remove();
            popped++;
            document.getElementById("popped").innerText = popped;

            if (popped >= 10) {
                finishGame();
            }
        });

        container.appendChild(balloon);
    }
}

createBalloons();

// When game ends → show video
function finishGame() {
    document.getElementById("video-overlay").style.display = "flex";

    let vid = document.getElementById("surpriseVideo");
    vid.play();

    // After video ends → go to next page
    vid.onended = function() {
        window.location.href = "page3.html"; // your next page file
    };
}
</script>

</body>
</html>
